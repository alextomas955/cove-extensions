# Style, analyzer, docs-lint, and Windows build/unit-test signal — independent checks with no
# `needs:` link to build.yml's validate/build/e2e/release chain, split out so they (a) run on
# direct pushes to main, which build.yml does not, (b) get their own minimal permissions rather than
# inheriting build.yml's release-scoped `contents: write`, and (c) can be re-run independently of
# the release pipeline (GitHub's re-run-failed-jobs action is scoped per workflow run).

name: Lint and Windows Signal

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"

permissions:
  contents: read

jobs:
  # ---- C# style + analyzer gate, run once against the shared .slnx, which is this gate's whole
  # subject list. dotnet format does not reach a referenced project, so narrowing the subject to one
  # project silently drops the shared/ projects and the second test tier out of format coverage.
  # Adding an extension's projects to the solution stays
  # manual because a .slnx is an explicit project list by design; an omission fails rather than passes,
  # because validate-extension-repo.mjs asserts every catalog-implied project is declared there.
  #
  # The subject list holds a test project that needs Cove's own source to compile, so this job checks
  # Cove out and runs in source mode. The analyzer step gains independently: a `none` build sees a
  # strict subset of the findings a source build sees.
  #
  # The two repositories are checked out as SIBLINGS under the workspace rather than nesting Cove
  # inside this one. Cove carries no Directory.Packages.props, so a nested clone inherits this repo's
  # central package management and every version-carrying PackageReference in Cove fails NU1008. ----
  csharp-format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: extensions
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
      # The ref is not named here: it is the highest floor the extensions themselves declare, read from
      # each entry's own extension.json. A version written into this file would be a second declaration
      # of a floor that already has one, free to disagree with it. Where entries disagree the highest
      # wins, and the run names every floor it saw.
      - name: Resolve the Cove ref from the declared floors
        id: floor
        working-directory: extensions
        shell: bash
        run: |
          node --input-type=module -e '
            import { readExtensionFloors } from "./scripts/fetch-cove-assemblies.mjs";
            const declared = readExtensionFloors();
            const parts = (v) => v.split(/[-+]/)[0].split(".").map(Number);
            const highest = declared.reduce((left, right) => {
              const [a, b] = [parts(left.floor), parts(right.floor)];
              for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] > b[i] ? left : right;
              return left;
            });
            for (const { entry, floor, manifestPath } of declared) {
              console.error(entry.name + " declares floor " + floor + " (from " + manifestPath + ")");
            }
            const distinct = new Set(declared.map((d) => d.floor));
            if (distinct.size > 1) {
              console.error("::notice::" + distinct.size + " distinct floors are declared; formatting and analysing against the highest, " + highest.floor + ".");
            }
            console.log("ref=v" + highest.floor);
          ' >> "$GITHUB_OUTPUT"
      - name: Check out Cove at the declared floor
        uses: actions/checkout@v7
        with:
          repository: yourcove/cove
          ref: ${{ steps.floor.outputs.ref }}
          fetch-depth: 1
          path: cove
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      # Formatting/style check — reads root .editorconfig. Runs the same script the pre-commit hook
      # and the repo-root npm scripts run; that script supplies the solution name itself. The exclude
      # keeps the sibling checkout out of the subject set: dotnet format walks the ProjectReference
      # graph into Cove's own source otherwise. dotnet format takes no -p:, so
      # COVE_SOURCE_MODE is the only spelling of the mode available to it.
      - name: dotnet format (verify)
        working-directory: extensions
        run: node scripts/check-csharp-format.mjs --verify-no-changes --severity warn --exclude ../cove/
        env:
          COVE_SOURCE_MODE: source
          COVE_REPO: ${{ github.workspace }}/cove
      # Analyzer gate: a Release build with TreatWarningsAsErrors=true (root Directory.Build.props)
      # fails on any CA/IDE warning.
      - name: Build with analyzers (warnings = errors)
        working-directory: extensions
        run: dotnet build CoveExtensions.slnx -c Release -p:CoveSourceMode=source -p:CoveRepoRoot="$COVE_REPO_ROOT"
        env:
          COVE_REPO_ROOT: ${{ github.workspace }}/cove

  # ---- Windows build + unit-test signal. Builds each catalog entry's cove-absent test project and
  # then runs it, so adding an extension is a catalog edit. The subject is those projects rather than
  # the whole solution, because the solution also holds a test project that needs Cove's own source,
  # which this leg's `none` mode does not supply. dotnet build follows the ProjectReference graph, so
  # building a test project also builds the extension and the shared projects it reaches.
  #
  # No E2E here, and this will not change: GitHub-hosted windows-latest runners fix Docker to Windows
  # containers with no supported switch to Linux ones, so Testcontainers cannot start the Cove app and
  # Postgres images at all. What is achievable is verified instead — the solution builds and the
  # cove-absent unit tier passes on Windows. A full Windows E2E would need a self-hosted runner. ----
  windows-build-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Build
        shell: bash
        run: |
          mapfile -t tests < <(node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("extensions/catalog.json", "utf8"));
            for (const entry of catalog.extensions) {
              if (entry.manifestOnly === true) continue;
              if (entry.testProjectPath) console.log(entry.testProjectPath);
            }
          ')
          for test in "${tests[@]}"; do
            echo "::group::dotnet build $test"
            dotnet build "$test" -c Release -p:CoveSourceMode=none
            echo "::endgroup::"
          done
      # The step above built each of these projects, so --no-build still holds.
      #
      # The loop stays sequential. Tests that map and unmap a subst drive letter are serialized by a
      # collection, and xUnit scopes a collection to one assembly, so two assemblies running at once
      # can reclaim a letter another is still holding.
      - name: Test (unit tier)
        shell: bash
        run: |
          mapfile -t tests < <(node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("extensions/catalog.json", "utf8"));
            for (const entry of catalog.extensions) {
              if (entry.manifestOnly === true) continue;
              if (entry.testProjectPath) console.log(entry.testProjectPath);
            }
          ')
          for test in "${tests[@]}"; do
            echo "::group::dotnet test $test"
            dotnet test --project "$test" -c Release --no-build -p:CoveSourceMode=none
            echo "::endgroup::"
          done

  # ---- Markdown docs. The file list lives in .markdownlint-cli2.jsonc and only there, because
  # markdownlint-cli2 APPENDS its config's globs to the command line: a glob passed here can only
  # widen the set while reading as a narrowing. The action's `globs` input has a non-empty default
  # (`*.{md,markdown}`, root-only), so an explicitly EMPTY value is the one spelling that leaves the
  # config as the single source. ----
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: ""

  # ---- Monorepo-wide ESLint from one root config. The type-aware UI rules need each extension's UI
  # deps installed to build the TypeScript program, hence the installs below before a single
  # `eslint .` from the repo root. Adding an extension needs no change here. ----
  js-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
      - name: Install root lint tooling
        run: npm ci --no-workspaces
      # build.yml's format:check covers only the Renamer.Ui bundle, so without this nothing blocking
      # checked the root set. lefthook formats staged files locally, but a local hook is advice a
      # contributor can skip. Placed before the UI installs so a formatting miss fails in seconds.
      - name: Prettier (whole monorepo)
        run: npm run format:check
      - name: Install each extension's UI deps (type-aware program inputs)
        shell: bash
        run: |
          mapfile -t uiPaths < <(node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("extensions/catalog.json", "utf8"));
            for (const entry of catalog.extensions) {
              if (entry.uiPath) console.log(entry.uiPath);
            }
          ')
          for ui in "${uiPaths[@]}"; do
            echo "::group::npm ci $ui"
            (cd "$ui" && npm ci)
            echo "::endgroup::"
          done
      # Every UI's wire types are gitignored and generated from its committed OpenAPI document, so on a
      # fresh checkout the module a UI imports does not exist yet — and the type-aware rules below then
      # report every read off it as an error-typed value. No --extension argument: neither Node job here
      # is matrix-driven, so the generator walks the whole catalog, which is the same catalog-driven
      # property stated once instead of once per extension.
      - name: Generate wire types
        run: node scripts/generate-wire-types.mjs

      - name: ESLint (whole monorepo)
        run: npm run lint

      # Dependency-version drift (.syncpackrc.json), and the one standing architectural gate this repo
      # still runs. It lives in this job because it needs only the root install already done above, and
      # it lives in a workflow rather than in lefthook because a local hook would not be a gate —
      # lefthook is silently absent whenever npm withholds its install script, and only a check a
      # workflow runs can block a merge. Its `source` globs, not npm workspace discovery, decide the
      # subject set: discovery reads the root plus the two e2e workspaces and would silently skip every
      # UI bundle and the docs site.
      - name: syncpack (dependency-version drift)
        run: npm run syncpack

      # Dead files, unused exports and unused dependencies on the TypeScript side. The C# side gates
      # the same class as a build error (IDE0051/0052/0060 in .editorconfig), so dropping this would
      # gate dead code on one tier and not the other. Runs after the UI installs and the wire-type
      # generation above: without those, knip reads a UI whose imported modules do not exist and
      # reports most of the tree as unused.
      # knip reads tests/e2e/playwright.config.mjs, which imports @playwright/test, so it needs the
      # workspaces the root install above deliberately skips. Installed here rather than by widening
      # that install: eslint and prettier do not need them, and this keeps the extra cost on the one
      # step that does.
      - name: Install workspaces (knip resolves their configs)
        run: npm ci

      - name: knip (dead files / exports / dependencies)
        run: npm run knip

      # Copy-paste, thresholded rather than absolute: .jscpd.json declares the threshold and the tree
      # sits under it. The point is to stop NEW accidental duplication entering silently, which is
      # cheapest to fix while the pull request is still open -- a duplication check that only runs
      # nightly is one nobody acts on. Generated and vendored code is excluded via gitignore:true and
      # the ignore list, since both duplicate by construction.
      - name: jscpd (copy-paste)
        run: npm run jscpd
