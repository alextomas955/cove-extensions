# SonarQube Cloud analysis with imported test coverage.
#
# Separate from build.yml on purpose: this needs a token, and a token is what GitHub withholds from a
# pull request opened from a fork or by Dependabot. Run inside build.yml it would either fail those
# pull requests or have to be excused from the required-check aggregate; run here it simply does not
# start, and no merge waits on it.
#
# The analysis is CI-based rather than SonarQube Cloud's Automatic Analysis, because Automatic
# Analysis cannot import coverage in any configuration. The two are mutually exclusive: this workflow
# does nothing until Automatic Analysis is turned off for the project.
#
# The .NET scanner rather than the CLI one: it is the only scanner that reads the MSBuild graph, which
# is what C# analysis and C# coverage import both need. It takes its settings from the /d: arguments
# below rather than from a properties file, which the .NET scanner does not read.

name: Sonar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A fork's pull request carries no secret, so the scanner would fail on an empty token. Skipping
    # is the honest outcome: the analysis did not run, rather than ran and found nothing.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Sonar reads the history to attribute new code to the commit that introduced it. A shallow
          # clone leaves every line looking new, which is what makes a New Code condition meaningless.
          fetch-depth: 0
          path: extensions

      # The C# suite compiles against Cove's own source, so this leg needs a checkout of it, at the
      # floor each extension declares. Same resolution lint.yml uses, and for the same reason: a
      # missing checkout would select the cove-absent branch and analyse a smaller set successfully.
      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"

      - name: Resolve the declared host floor
        id: floor
        working-directory: extensions
        shell: bash
        run: |
          node --input-type=module -e '
            import { readExtensionFloors, highestDeclaredFloor } from "./scripts/fetch-cove-assemblies.mjs";
            const declared = readExtensionFloors();
            const highest = highestDeclaredFloor(declared);
            for (const { entry, floor, manifestPath } of declared) {
              console.error(entry.name + " declares floor " + floor + " (from " + manifestPath + ")");
            }
            console.log("ref=v" + highest.floor);
          ' >> "$GITHUB_OUTPUT"

      - name: Check out Cove at the declared floor
        uses: actions/checkout@v7
        with:
          repository: yourcove/cove
          ref: ${{ steps.floor.outputs.ref }}
          fetch-depth: 1
          path: cove

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the scanner
        run: dotnet tool install --global dotnet-sonarscanner

      # The frontend coverage report. Generated before the scanner starts, because `begin` records the
      # report path and the file has to exist by the time `end` reads it.
      - name: Install frontend deps
        working-directory: extensions/extensions/Renamer/src/Renamer.Ui
        run: npm ci

      - name: Install root tooling
        working-directory: extensions
        run: npm ci --no-workspaces --ignore-scripts

      - name: Collect frontend coverage
        working-directory: extensions/extensions/Renamer/src/Renamer.Ui
        run: npm run test:coverage

      # Vitest records each path relative to the directory its config sits in, and the scanner
      # resolves an lcov path against the repository root. Without this the shared package's records
      # name no file and report nought per cent, which reads as a coverage gap rather than a wiring
      # fault. The script refuses an empty or missing report rather than passing one through.
      - name: Make the coverage paths repository-relative
        working-directory: extensions
        run: node scripts/normalize-lcov-paths.mjs

      # scanAll is on because this repository is not only C#: left at the .NET scanner's default the
      # analysis covers the MSBuild graph alone and no TypeScript is examined at all, which reads as a
      # clean frontend rather than an unanalysed one.
      - name: Begin analysis
        working-directory: extensions
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.scanner.scanAll=true \
            /d:sonar.sources="extensions,shared,scripts" \
            /d:sonar.exclusions="**/node_modules/**,**/dist/**,**/bin/**,**/obj/**,**/vendor/**,**/artifacts/**,**/coverage/**,**/src/wire/**,website/build/**,website/.docusaurus/**" \
            /d:sonar.coverage.exclusions="scripts/**,tests/**,**/e2e/**,website/**,**/*.config.*,shared/ui-shared/vite/**,shared/ui-shared/scripts/**,**/*.d.ts" \
            /d:sonar.cpd.exclusions="**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.spec.mjs,**/*.spec.ts,**/*Tests.cs" \
            /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/coverage.xml" \
            /d:sonar.javascript.lcov.reportPaths="extensions/Renamer/src/Renamer.Ui/coverage/lcov.info"

      - name: Build
        working-directory: extensions
        run: dotnet build CoveExtensions.slnx -c Release -p:CoveSourceMode=source -p:CoveRepoRoot="${{ github.workspace }}/cove"

      # Visual Studio coverage XML, which is the format Sonar's C# analyzer reads; it accepts no
      # Cobertura. --no-build so the assemblies the scanner just observed are the ones measured.
      - name: Test with coverage
        working-directory: extensions
        run: |
          dotnet test --project extensions/Renamer/src/Renamer.Tests/Renamer.Tests.csproj -c Release --no-build \
            -p:CoveSourceMode=source -p:CoveRepoRoot="${{ github.workspace }}/cove" \
            -- --coverage --coverage-output-format xml --coverage-output coverage.xml

      - name: End analysis
        working-directory: extensions
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
