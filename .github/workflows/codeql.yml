# CodeQL security analysis.
#
# C# is built on a bare runner with no Cove monorepo, so the build leg uses the same NuGet path the
# main build uses (CoveSourceMode=none): Cove.Sdk (and its transitive Cove.Plugins/Cove.Core)
# restore from nuget.org. The `source` mode is deliberately NOT used here - it needs a Cove
# checkout the runner does not have.
#
# The C# leg builds every catalog extension's project, reading the project paths from
# extensions/catalog.json, so CodeQL's manual build traces each extension's
# compilation. Adding an extension is a catalog edit - no change here.

name: CodeQL

# Analysis runs on proposals, on what lands, and on a clock. The pull-request leg is the one that
# pays: a finding it reports can still be edited out of an unmerged branch, where the same finding
# on `main` costs a follow-up commit and stays in history either way. It is kept even though this
# repo is single-maintainer, because analysing a proposal mostly catches the author's own mistakes
# rather than a hostile fork's - and because the leg is free, runs in parallel and gates nothing
# else, so there is no saving to weigh against it. The push leg then covers anything reaching `main`
# by another route, and the weekly cron re-analyses unchanged code against updated queries.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so analysis runs even when no new commits land.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          # The workflows themselves: script injection from untrusted event fields, and permissions
          # broader than a job needs. Runs on fork and Dependabot pull requests too, which the Sonar
          # workflow cannot, and those are where workflow injection matters.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The project list below comes from a Node script, which needs the pinned Node rather than the
      # runner's default.
      - name: Setup Node
        if: matrix.language == 'csharp'
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build C#
        if: matrix.language == 'csharp'
        shell: bash
        run: |
          mapfile -t projects < <(node scripts/ci-catalog.mjs list projectPath)
          for project in "${projects[@]}"; do
            echo "::group::dotnet build $project"
            dotnet build "$project" -c Release -p:CoveSourceMode=none
            echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
