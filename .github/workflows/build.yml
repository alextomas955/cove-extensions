# Build, validate, and (on <extension-slug>/v* tags) package + release extensions in this monorepo.
#
# Adapted from yourcove/multi-extension-repo-template's build.yml (forked 2026-07-01) to target
# Renamer's real src/ subtree layout via extensions/catalog.json's additive path fields
# (projectPath/manifestPath/uiPath — see catalog.json + scripts/validate-extension-repo.mjs)
# instead of the template's flat {path}/{name}.csproj convention. Folds in the old single-extension
# `rename` repo's packaging, csharp-format and markdown-lint hardening as matrix steps
# (per-extension) or root-level jobs (repo-wide) so future extensions inherit them automatically.
#
# The validate job computes the build matrix from catalog.json (all entries for a pull request or a
# scheduled run; only the tagged extension for a tag push) and — on a tag push — confirms the tag
# matches exactly one catalog entry's tagPrefix, carries a valid semver suffix, and agrees with both
# that entry's extension.json version and its registry manifest's newest versions[] row. No PR trigger
# path filtering is used anywhere: every catalog entry is built on every PR. It also resolves the Cove
# version axis the two safety legs fan out over, which is why the same commit can go red on a scheduled
# run having been green on its pull request: the hosts under test are resolved, not pinned.
#
# Required-check model: the `required-checks` aggregation job is the single status check to mark
# required in branch protection; it transitively gates on `build` (the bare C# unit tier, which states
# CoveSourceMode=none), `test-cove-present` (the WHOLE C# suite against Cove assemblies extracted from
# the released cove-app image, which is where the rollback/undo/ingest/loop-safety tests actually run),
# and `e2e` (Playwright + the optional per-extension node:test correctness tier). A "0 node specs
# found" hard-fails, never passes silently — but the tier runs only for a catalog entry that declares
# e2eNodeTestsPath, so an entry declaring none is not covered by it at all.

name: Build and Release Extensions

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - "*/v*"
  # A daily signal on a moving target, which the two triggers above cannot give: the newest published
  # Cove versions are resolved off the registry at run time, so the same commit tests different hosts on
  # different days, and an upstream change that breaks this extension would otherwise surface only on
  # whichever pull request happened to come next. What it costs is stated rather than absorbed: EVERY job
  # in this file runs daily, including both safety legs and the aggregate, so this is recurring runner
  # spend for a repository with a single maintainer.
  #
  # 06:00 UTC is chosen to be well outside that maintainer's working hours, so a red arrives before a
  # session rather than during one. One caveat that costs a day of debugging if not known: the upstream
  # images move too, and a scheduled run landing inside an upstream rebuild window can read a
  # partially-updated tag. A red that recurs at this hour and passes on re-run is the schedule, not the
  # workflow.
  schedule:
    - cron: "0 6 * * *"

env:
  DOTNET_VERSION: "10.0.x"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      # A SECOND output, deliberately: `build`, `test-cove-present` and `e2e` all read `matrix`, so
      # widening that one would multiply `build` — which compiles against CoveSourceMode=none and has
      # nothing to do with a host version.
      coveMatrix: ${{ steps.coveMatrix.outputs.coveMatrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"

      - name: Validate extension catalog
        run: node scripts/validate-extension-repo.mjs

      # Globbed rather than named file-by-file: a hand-maintained list silently stops covering a
      # test the moment one is added, and a check no workflow runs cannot block a merge. Every
      # scripts/*.test.mjs is fixture-driven and needs only node.
      - name: Test repo tooling
        run: node --test scripts/*.test.mjs

      # The tag is the version authority and extension.json is the single hand-edited declaration of
      # it, so this is where the two are reconciled — in validate, before anything builds, rather than
      # after a full matrix has run. It also confirms the registry manifest already carries a
      # versions[] row for the release being cut, which is otherwise only discovered when the registry
      # pull request fails days later. The registry file is checked only when it exists: an extension
      # not yet published to the store has none, and its absence is not a defect.
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const catalog = JSON.parse(fs.readFileSync("extensions/catalog.json", "utf8"));
            const tag = process.env.GITHUB_REF.replace("refs/tags/", "");
            const matches = catalog.extensions.filter((e) => tag.startsWith(e.tagPrefix));
            if (matches.length !== 1) {
              console.error("Tag " + tag + " must match exactly one catalog tagPrefix, matched " + matches.length);
              process.exit(1);
            }
            const entry = matches[0];
            const versionTag = tag.slice(entry.tagPrefix.length);
            const semver = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/;
            if (!semver.test(versionTag)) {
              console.error("Tag version suffix " + versionTag + " is not valid semver (expected v<major>.<minor>.<patch>)");
              process.exit(1);
            }
            const version = versionTag.slice(1);
            const manifestPath = entry.manifestPath || path.posix.join(entry.path, "extension.json");
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.version !== version) {
              console.error("Tag " + tag + " releases " + version + ", but " + manifestPath + " declares version " + manifest.version + " — set that version to " + version + ", or retag.");
              process.exit(1);
            }
            const registryPath = path.posix.join(entry.path, "extensions", entry.id + ".json");
            let registryChecked = "no registry manifest at " + registryPath + ", so no versions[] row was checked";
            if (fs.existsSync(registryPath)) {
              const registry = JSON.parse(fs.readFileSync(registryPath, "utf8"));
              const latest = Array.isArray(registry.versions) ? registry.versions[0] : null;
              if (latest == null || latest.version !== version) {
                const found = latest == null ? "there are no versions[] rows" : "versions[0] is " + latest.version;
                console.error("Registry manifest " + registryPath + " does not describe this release: prepend a versions[] row for " + version + " (" + found + "). Do not edit an existing row — each one describes an immutable published artifact.");
                process.exit(1);
              }
              registryChecked = registryPath + " versions[0] is " + version;
            }
            console.log("Tag " + tag + " releases " + entry.id + " " + version + "; " + manifestPath + " agrees; " + registryChecked + ".");
          '
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Compute build matrix
        id: matrix
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("extensions/catalog.json", "utf8"));
            const ref = process.env.GITHUB_REF;
            let extensions = catalog.extensions;
            if (ref.startsWith("refs/tags/")) {
              const tag = ref.replace("refs/tags/", "");
              extensions = catalog.extensions.filter((e) => tag.startsWith(e.tagPrefix));
            }
            const matrix = { extension: extensions };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(matrix) + "\n");
          '
        env:
          GITHUB_REF: ${{ github.ref }}

      # The version axis, resolved ONCE here and fanned out, rather than once per leg per extension:
      # every leg then tests a tag something reported, and there is a single place where "what was
      # examined, and what did that resolve to" is printed. The resolver reaches each entry's floor
      # through that entry's own manifest, so a second extension needs a catalog entry and no edit.
      #
      # The join reuses the matrix step's ref filtering rather than repeating it — two copies of that
      # filter would agree until the day they did not. An empty join is a hard failure: a version axis
      # that resolved nothing must not read as an axis with nothing to test.
      - name: Resolve the Cove version axis
        id: coveMatrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-cove-assemblies.mjs --resolve-tags --report > /tmp/cove-legs.json
          node -e '
            const fs = require("fs");
            const resolved = JSON.parse(fs.readFileSync("/tmp/cove-legs.json", "utf8"));
            const selected = new Set(JSON.parse(process.env.BUILD_MATRIX).extension.map((e) => e.id));
            const include = resolved.include.filter((combo) => selected.has(combo.extension.id));
            if (include.length === 0) {
              console.error("::error::The Cove version axis resolved no leg for any selected extension, so the safety tiers would run against nothing.");
              process.exit(1);
            }
            for (const combo of include) {
              console.log("cove leg: " + combo.extension.name + " " + combo.cove.role + " " + combo.cove.tag);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "coveMatrix=" + JSON.stringify({ include }) + "\n");
          '
        env:
          BUILD_MATRIX: ${{ steps.matrix.outputs.matrix }}

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    permissions:
      contents: read
    steps:
      # Every catalog- and version-derived value in this job's shell bodies arrives through the step's
      # own environment and is read as a quoted variable, never spliced into the body text:
      # extensions/catalog.json is editable by a pull request from a fork, and a value in the
      # environment is data the shell reads, where the same value in the body is code the shell runs.
      - name: Derive version
        id: check
        shell: bash
        run: |
          prefix="refs/tags/${TAG_PREFIX}v"
          if [[ "${GITHUB_REF}" == "${prefix}"* ]]; then
            echo "version=${GITHUB_REF#"${prefix}"}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG_PREFIX: ${{ matrix.extension.tagPrefix }}

      # Unconditional: the validate job's matrix computation already filters to only the tagged
      # extension on a tag push (all entries on a PR), so there is nothing left for this job to
      # re-check per-step.
      - uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ !matrix.extension.manifestOnly }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        if: ${{ !matrix.extension.manifestOnly }}
        run: dotnet restore "$PROJECT_PATH" -p:CoveSourceMode=none
        env:
          PROJECT_PATH: ${{ matrix.extension.projectPath }}

      - name: Build
        if: ${{ !matrix.extension.manifestOnly }}
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore -p:CoveSourceMode=none "-p:Version=$EXTENSION_VERSION" -p:ContinuousIntegrationBuild=true
        env:
          PROJECT_PATH: ${{ matrix.extension.projectPath }}
          EXTENSION_VERSION: ${{ steps.check.outputs.version }}

      # Cove-absent tier — this leg states CoveSourceMode=none, so the test project's cove-referencing
      # sources are Compile-Removed (see Renamer.Tests.csproj's cove-absent group). What survives is
      # every test that needs no Cove source type, across every tier, not a tier of its own. The mode is
      # DECLARED rather than inferred from whether a ../cove sibling happens to be on disk: that
      # inference is what let a smaller run read as a pass. The rest of the suite runs in the
      # test-cove-present job below. Runs before Publish so a test failure blocks packaging, matching
      # windows-build-test's build-then-test order in lint.yml. Optional: an extension without a
      # testProjectPath entry in catalog.json skips this step (manifestOnly-style opt-out).
      #
      # The floor is what makes this a gate rather than a report. It is a FLOOR, not an equality, so
      # adding tests never breaks it; a total BELOW it means a file dropped off this leg, which is
      # exactly the defect a per-file Compile-Remove list exists to prevent and a directory wildcard
      # used to cause silently. A log with no Total: line fails too rather than comparing as zero — an
      # absent figure means the run did not report, which is not the same as reporting nothing. Both C#
      # legs now state what they must contain; before that, any number at all read as correct.
      #
      # Catalog-driven for the same reason the cove-present floor is: the value is a per-extension fact,
      # so a second extension declares its own rather than inheriting Renamer's. Declaring a test
      # project and no floor is a hard error, not a skip — a leg with nothing to compare against is the
      # shape this check exists to make impossible.
      - name: Test (unit tier)
        if: ${{ !matrix.extension.manifestOnly && matrix.extension.testProjectPath != '' }}
        shell: bash
        run: |
          set -o pipefail
          # A POSITIVE-INTEGER shape check, not merely a non-empty one. Non-empty passes "0", and a floor
          # of zero admits any total — a gate that reads as configured while comparing against nothing.
          # It also passes a typo, which bash arithmetic resolves to 0 for the same effect. The pattern
          # additionally keeps catalog text out of arithmetic context: `(( x < $VAR ))` EVALUATES $VAR's
          # content, where an array subscript performs command substitution, so a fork-editable file
          # would reach the runner as code. Comparison below uses [ -lt ] on validated digits instead.
          if [[ ! "$MINIMUM_TOTAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::$EXTENSION_NAME declares a testProjectPath but unitTestMinimumTotal in extensions/catalog.json is '$MINIMUM_TOTAL', not a positive integer. Without a usable floor this leg cannot tell a full run from a smaller one, so it would report green while proving less."
            exit 1
          fi
          dotnet test "$TEST_PROJECT_PATH" -c Release -p:CoveSourceMode=none | tee /tmp/unit-tier.log
          total=$(grep -oE 'Total: *[0-9]+' /tmp/unit-tier.log | tail -1 | grep -oE '[0-9]+')
          if [[ -z "$total" ]]; then
            echo "::error::No Total: figure in the test output — the run did not report, which is a failure and not a zero."
            exit 1
          fi
          if [ "$total" -lt "$MINIMUM_TOTAL" ]; then
            echo "::error::$EXTENSION_NAME ran $total tests against a floor of $MINIMUM_TOTAL. A file dropped off the cove-absent leg — check the Compile-Remove list rather than lowering the floor."
            exit 1
          fi
          echo "Unit tier ran $total tests (floor $MINIMUM_TOTAL)."
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          TEST_PROJECT_PATH: ${{ matrix.extension.testProjectPath }}
          MINIMUM_TOTAL: ${{ matrix.extension.unitTestMinimumTotal }}

      # AFTER the unit tier, because the emit test inside it is what WROTE this file; running before it
      # would diff whatever the checkout happened to carry. The document is derived from the endpoint
      # registrations, so a difference here means a handler and the committed wire contract disagree —
      # which is the one thing a consumer of the generated types cannot see for itself.
      - name: Verify the wire document is current
        if: ${{ !matrix.extension.manifestOnly && matrix.extension.wireDocumentPath != '' }}
        shell: bash
        run: |
          # Fail closed: a declared document that is missing or empty means the emit never ran, and an
          # unchanged-because-absent file would otherwise read exactly like an unchanged-because-correct one.
          if [[ ! -s "$WIRE_DOC" ]]; then
            echo "::error::$WIRE_DOC is declared in catalog.json but is missing or empty — the emit test did not write it."
            exit 1
          fi
          if ! git diff --exit-code -- "$WIRE_DOC"; then
            echo "::error::$WIRE_DOC changed — the handler signatures and the committed wire document disagree. Re-run the document-emitting test and commit the result."
            exit 1
          fi
          echo "Wire document is current: $WIRE_DOC"
        env:
          WIRE_DOC: ${{ matrix.extension.wireDocumentPath }}

      # Publishes to a throwaway directory, NOT the package directory: the package receives only what
      # the assemble step below copies into it, so nothing the build happens to emit alongside the
      # shipped files can reach a release without being declared.
      - name: Publish
        if: ${{ !matrix.extension.manifestOnly }}
        run: dotnet publish "$PROJECT_PATH" -c Release -o "artifacts/publish/$EXTENSION_NAME" --no-build -p:CoveSourceMode=none "-p:Version=$EXTENSION_VERSION" -p:ContinuousIntegrationBuild=true
        env:
          PROJECT_PATH: ${{ matrix.extension.projectPath }}
          EXTENSION_NAME: ${{ matrix.extension.name }}
          EXTENSION_VERSION: ${{ steps.check.outputs.version }}

      # Conditional frontend build — only extensions with a uiPath field ship a frontend bundle.
      - name: Setup Node
        if: ${{ matrix.extension.uiPath != '' }}
        uses: actions/setup-node@v7
        with:
          # Pin matches the UI package.json volta pin for a reproducible build.
          node-version: "24.11.0"

      - name: Install frontend deps (offline, vendored SDK)
        if: ${{ matrix.extension.uiPath != '' }}
        working-directory: ${{ matrix.extension.uiPath }}
        run: npm ci

      # The UI's wire types are generated from the committed OpenAPI document and are gitignored, so a
      # fresh checkout carries none and the typecheck below would fail on a module that does not exist.
      # The generator is a repo-ROOT devDependency and the frontend install above is scoped to the
      # extension's UI directory, so the root has to be installed too. --no-workspaces keeps that to the
      # root's own tooling: a plain root install would also pull in the browser-driven end-to-end
      # harness workspace, which this job never uses. Both steps carry the generate step's condition so
      # an entry declaring no wire document pays for neither.
      - name: Install root tooling (wire-type generator)
        if: ${{ matrix.extension.uiPath != '' && matrix.extension.wireDocumentPath != '' }}
        run: npm ci --no-workspaces

      - name: Generate wire types
        if: ${{ matrix.extension.uiPath != '' && matrix.extension.wireDocumentPath != '' }}
        run: node scripts/generate-wire-types.mjs --extension "$EXTENSION_ID"
        env:
          EXTENSION_ID: ${{ matrix.extension.id }}

      - name: Verify frontend (typecheck + format:check + test)
        if: ${{ matrix.extension.uiPath != '' }}
        working-directory: ${{ matrix.extension.uiPath }}
        run: npm run verify

      - name: Build frontend bundle
        if: ${{ matrix.extension.uiPath != '' }}
        working-directory: ${{ matrix.extension.uiPath }}
        run: npm run build

      # Runs after the frontend build because the UI bundle is one of the declared artifacts and does
      # not exist before that step. Unconditional on the event, so every pull request is the release
      # rehearsal: the same script assembles the same declared set a tag push ships.
      - name: Assemble package
        if: ${{ !matrix.extension.manifestOnly }}
        run: node scripts/assemble-package.mjs --publish-dir "artifacts/publish/$EXTENSION_NAME" --package-dir "artifacts/$EXTENSION_NAME" --extension "$EXTENSION_ID" --version "$EXTENSION_VERSION"
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          EXTENSION_ID: ${{ matrix.extension.id }}
          EXTENSION_VERSION: ${{ steps.check.outputs.version }}

      # Archives what the assemble step wrote, so it carries the same manifest-only guard that step
      # carries. Without it the two conditions disagree: on a tag push a manifest-only entry would cd
      # into a directory the skipped assemble never created. With it, such an entry archives nothing
      # and uploads nothing, so no artifact for it reaches the release job — this workflow does not
      # release a manifest-only entry, it skips one.
      - name: Package
        if: ${{ startsWith(github.ref, 'refs/tags/') && !matrix.extension.manifestOnly }}
        shell: bash
        run: |
          cd "artifacts/$EXTENSION_NAME"
          zip -r "../../${EXTENSION_ID}-${EXTENSION_VERSION}.zip" .
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          EXTENSION_ID: ${{ matrix.extension.id }}
          EXTENSION_VERSION: ${{ steps.check.outputs.version }}

      - name: Upload artifact
        if: ${{ startsWith(github.ref, 'refs/tags/') && !matrix.extension.manifestOnly }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}-${{ steps.check.outputs.version }}
          path: ${{ matrix.extension.id }}-${{ steps.check.outputs.version }}.zip

  # ---- The cove-present C# tier: the whole test suite, compiled and run against Cove taken from the
  # RELEASED cove-app image rather than from a source checkout. This is what closes the gap where the
  # bare `build` leg above compiles only the pure-core tests — every rollback / undo / ingest /
  # loop-safety assertion that needs a real CoveContext runs here, in process, and blocks a merge.
  #
  # Catalog-driven like every other leg: a second extension gains this job through its catalog entry,
  # with no edit here. No Cove version is named in this file either — each leg's tag arrives resolved
  # from validate's version axis, which reads it off the registry against the floor the extension
  # declares in its own manifest, and the repository half still comes from Directory.Build.props.
  #
  # This job's matrix is the version axis (coveMatrix), so its combos are flat: `matrix.extension` is
  # still the catalog entry and `matrix.cove` is the leg. A cross product would have paired one
  # extension with another's floor, which is correct with one extension and silently wrong with two.
  test-cove-present:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.coveMatrix) }}
    # An upstream release-candidate regression is not this pull request's defect, and a gate that can
    # freeze merges for someone else's breakage is a gate that gets switched off — so the leg testing an
    # unreleased Cove reports rather than blocks. The value is the LEG'S OWN flag, so which roles are
    # advisory is a fact the resolver states once and no consumer re-derives from a role name.
    #
    # Two things about how this reads on a run, both easy to mistake for defects. A job that fails under
    # this setting still renders a red cross on the run; branch protection keys on the aggregate status
    # further down, which reports success for such a job, so the red is a cosmetic residue of the
    # mechanism rather than a merge block. And the local workflow runner (act, through 0.2.89) does not
    # implement job-level continue-on-error at all — neither a literal nor a matrix expression — so it
    # leaves the downstream result at `failure` and exits non-zero whenever this leg fails. A local run
    # reporting failure for an advisory leg is therefore a runner artefact, not something to fix here.
    continue-on-error: ${{ matrix.cove.advisory }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Fail closed on the floor: an entry that declares a test project but no coveTestMinimumTotal
      # would run this tier with nothing to compare its total against — which is precisely the
      # "green while compiling less than the mode implies" shape this job exists to make impossible.
      # An entry with no test project skips the tier entirely, matching the unit-tier opt-out.
      - name: Check for a cove-present tier
        id: check
        shell: bash
        run: |
          if [[ "$MANIFEST_ONLY" == "true" || -z "$TEST_PROJECT_PATH" ]]; then
            echo "has_tier=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$EXTENSION_NAME declares no testProjectPath — skipping the cove-present tier."
            exit 0
          fi
          # Positive integer, not merely non-empty — see the unit tier's floor for why "0" and a typo
          # both disarm the comparison, and why validating the shape here keeps catalog text out of the
          # arithmetic context the comparison would otherwise evaluate.
          if [[ ! "$MINIMUM_TOTAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::$EXTENSION_NAME declares a testProjectPath but coveTestMinimumTotal in extensions/catalog.json is '$MINIMUM_TOTAL', not a positive integer. Without a usable floor this tier cannot tell a full run from a smaller one, so it would report green while proving less."
            exit 1
          fi
          echo "has_tier=true" >> "$GITHUB_OUTPUT"
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          MANIFEST_ONLY: ${{ matrix.extension.manifestOnly }}
          TEST_PROJECT_PATH: ${{ matrix.extension.testProjectPath }}
          MINIMUM_TOTAL: ${{ matrix.extension.coveTestMinimumTotal }}

      # The fetcher is Node, and it deliberately shells out to nothing — no docker, no curl, no tar —
      # so this and the .NET SDK are the whole toolchain.
      - uses: actions/setup-node@v7
        if: steps.check.outputs.has_tier == 'true'
        with:
          node-version: "24.11.0"

      - name: Setup .NET
        if: steps.check.outputs.has_tier == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # A leg's tag reaches BOTH consumers from the one env entry below: --tag here, because the
      # fetcher text-parses Directory.Build.props and cannot see an MSBuild global property, and
      # -p:CoveTestImageTag on the test step, because the build's staleness guard compares what the
      # extraction recorded against what this leg was told to test. They are two consumers of one
      # value, and the guard's whole job is to fail when they disagree.
      #
      # A resolved registry tag is third-party input, so it arrives through the step's own environment
      # and is read as a quoted variable — data the shell reads, never text the shell runs.
      - name: Fetch Cove assemblies from the released image
        if: steps.check.outputs.has_tier == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/fetch-cove-assemblies.mjs --tag "$COVE_TAG" --out artifacts/cove-assemblies | tee /tmp/fetch.log
          digest=$(grep -E '^manifest digest: ' /tmp/fetch.log | tail -1)
          assembly=$(grep -E '^Cove\.Data\.dll assembly version: ' /tmp/fetch.log | tail -1)
          informational=$(grep -E '^Cove\.Data\.dll informational version: ' /tmp/fetch.log | tail -1)
          if [[ -z "$digest" || -z "$assembly" ]]; then
            echo "::error::The fetcher reported no manifest digest or no assembly version, so there is nothing to attribute a later failure to."
            exit 1
          fi
          echo "::notice::Cove under test ($COVE_ROLE $COVE_TAG) — $digest; $assembly; $informational"
        env:
          COVE_TAG: ${{ matrix.cove.tag }}
          COVE_ROLE: ${{ matrix.cove.role }}

      # -p:CoveSourceMode=assemblies is stated EXPLICITLY: an infrastructure failure that left the
      # extraction empty must fail this job, not quietly select the cove-absent branch and report a
      # smaller green run. The build's own AssertCoveLocation refuses that case, and the floor below is
      # the second half of the same guard.
      #
      # The floor is a FLOOR, not an equality, so adding tests never breaks it. A total BELOW it means
      # the leg compiled less than the mode implies, which is the defect being closed — the same
      # invocation with CoveSourceMode=none reports materially fewer tests, so this comparison can fail
      # rather than being a formality. A log with no Total: line fails too, rather than comparing as
      # zero: an absent figure means the run did not report, which is not the same as reporting nothing.
      - name: Test (cove-present tier, assemblies from the released image)
        if: steps.check.outputs.has_tier == 'true'
        shell: bash
        run: |
          set -o pipefail
          dotnet test "$TEST_PROJECT_PATH" -c Release \
            -p:CoveSourceMode=assemblies \
            -p:CoveTestImageTag="$COVE_TAG" \
            -p:CoveAssembliesDir=artifacts/cove-assemblies | tee /tmp/cove-present.log
          total=$(grep -oE 'Total: *[0-9]+' /tmp/cove-present.log | tail -1 | grep -oE '[0-9]+')
          if [[ -z "$total" ]]; then
            echo "::error::No Total: figure in the test output — the run did not report, which is a failure and not a zero."
            exit 1
          fi
          # [ -lt ] on digits the check step already validated, never (( )) — arithmetic context
          # re-evaluates the variable's CONTENT, so catalog text would reach the runner as code.
          if [ "$total" -lt "$MINIMUM_TOTAL" ]; then
            echo "::error::$EXTENSION_NAME ran $total tests against a floor of $MINIMUM_TOTAL. The leg compiled less than CoveSourceMode=assemblies implies — check that the extraction is complete rather than lowering the floor."
            exit 1
          fi
          echo "Cove-present tier ran $total tests against Cove $COVE_TAG (floor $MINIMUM_TOTAL)."
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          TEST_PROJECT_PATH: ${{ matrix.extension.testProjectPath }}
          MINIMUM_TOTAL: ${{ matrix.extension.coveTestMinimumTotal }}
          COVE_TAG: ${{ matrix.cove.tag }}

  # ---- E2E: rebuilds each extension (a separate job from build/matrix.extension — GitHub Actions
  # jobs don't share a filesystem, so this job publishes its own fresh copy rather than trying to
  # reuse the build job's disk state) and installs the result into a containerized, official Cove
  # instance via tests/e2e's shared harness, then runs its Playwright suite against it.
  # Extensions without their own e2e suite are skipped via the catalog's optional
  # `e2ePath`/`e2eProject` fields (absent = no suite yet, not a failure).
  #
  # This job's matrix is the version axis (coveMatrix), the same one test-cove-present takes, so its
  # combos are flat: `matrix.extension` is the catalog entry and `matrix.cove` is the leg. The two safety
  # legs see different things — one runs the suite in process against the image's assemblies, this one
  # installs the assembled package into the running host and drives it — so a host version that only the
  # second would notice (a load refusal, a changed route) is worth the second axis rather than tested on
  # the floor alone.
  e2e:
    needs: [validate, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.coveMatrix) }}
    # Advisory on the forward-looking leg, for the reason and with the caveats stated once on
    # test-cove-present above.
    continue-on-error: ${{ matrix.cove.advisory }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Every catalog-derived value in this job's shell bodies arrives through the step's own
      # environment and is read as a quoted variable, for the reason the build job states above:
      # extensions/catalog.json is editable by a pull request from a fork, and a value in the
      # environment is data the shell reads, where the same value in the body is code the shell runs.
      # The worst outcome here is not exfiltration — an injected body can `exit 0`, so this job would
      # report success having run no specs, and required-check aggregation would go green over it.
      # `if:`, `with:` and `working-directory:` are evaluated by Actions rather than by a shell, so a
      # value reaching only those is not part of this hazard.
      - name: Check for an e2e suite
        id: check
        shell: bash
        run: |
          if [[ -n "$E2E_PATH" && -d "$E2E_PATH" && -n "$E2E_PROJECT" ]]; then
            echo "has_suite=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_suite=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$EXTENSION_NAME has no e2ePath/e2eProject in catalog.json (or the directory is missing) — skipping E2E for this extension."
          fi
          # Fail closed on the node:test tier: a catalog entry DECLARING an e2eNodeTestsPath makes the
          # tier required, so a declared-but-missing directory (a typo or a moved/deleted path) is a hard
          # error here — never a silent has_node_tests=false that would skip the required correctness run.
          #
          # When NO entry declares the path the tier gates nothing, and that says so out loud rather than
          # skipping quietly. The distinction matters because the steps below describe this tier as a
          # required backstop: a reader of required-checks would otherwise take contracts to be covered
          # that no job ran. Its one historical subscriber was the WhisparrSync entry, removed in e6b2263;
          # the mechanism is kept because it is catalog-driven and a second extension can subscribe
          # without a workflow edit, but an unsubscribed gate must not read as a passing one.
          if [[ -n "$E2E_NODE_TESTS_PATH" ]]; then
            if [[ -d "$E2E_NODE_TESTS_PATH" ]]; then
              echo "has_node_tests=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::e2eNodeTestsPath '$E2E_NODE_TESTS_PATH' is declared in catalog.json but that directory does not exist — the required node:test correctness tier cannot run."
              exit 1
            fi
          else
            echo "has_node_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$EXTENSION_NAME declares no e2eNodeTestsPath in catalog.json, so the node:test correctness tier ran NOTHING for it and gated nothing. Declare the path to subscribe."
          fi
        env:
          EXTENSION_NAME: ${{ matrix.extension.name }}
          E2E_PATH: ${{ matrix.extension.e2ePath }}
          E2E_PROJECT: ${{ matrix.extension.e2eProject }}
          E2E_NODE_TESTS_PATH: ${{ matrix.extension.e2eNodeTestsPath }}

      - name: Setup .NET
        if: (steps.check.outputs.has_suite == 'true' || steps.check.outputs.has_node_tests == 'true') && !matrix.extension.manifestOnly
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Publishes to <extension.path>/artifacts/publish, NOT the build job's repo-root-relative
      # publish directory — this must match the path each extension's own e2e fixtures file expects
      # (e.g. Renamer's RENAMER_EXTENSION.publishDir), which mirrors what a local dev deploy script
      # (deploy-dev.ps1) produces. A mismatch here fails every E2E test at harness install time with
      # "publishDir does not exist" — found via this repo's actual first CI run, since this job's
      # own publish path was never exercised against the real fixtures before.
      #
      # The harness assembles the declared package from this publish output in-process, so a change to
      # the package shape reaches this job through extensions/catalog.json with no workflow edit here.
      #
      # This publish carries no -p:ContinuousIntegrationBuild=true, unlike the build job's, so it is
      # the one Linux publish whose generated json is not path-normalised by construction — and the
      # in-process assemble applies the absolute-path refusal to it. If that refusal ever fires here,
      # the remedy is adding that flag to this step, never weakening the check.
      - name: Build extension (publish output for the harness to install)
        if: (steps.check.outputs.has_suite == 'true' || steps.check.outputs.has_node_tests == 'true') && !matrix.extension.manifestOnly
        shell: bash
        run: dotnet publish "$PROJECT_PATH" -c Release -o "$EXTENSION_PATH/artifacts/publish" -p:CoveSourceMode=none
        env:
          PROJECT_PATH: ${{ matrix.extension.projectPath }}
          EXTENSION_PATH: ${{ matrix.extension.path }}

      - name: Setup Node
        if: steps.check.outputs.has_suite == 'true' || steps.check.outputs.has_node_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"

      - name: Build extension UI bundle
        if: (steps.check.outputs.has_suite == 'true' || steps.check.outputs.has_node_tests == 'true') && matrix.extension.uiPath != ''
        working-directory: ${{ matrix.extension.uiPath }}
        run: |
          npm ci
          npm run build

      # npm ci runs at the REPO ROOT so the workspace symlinks (node_modules/@cove-extensions/e2e ->
      # tests/e2e) + the single hoisted @playwright/test are established before the suite runs. A
      # `cd tests/e2e && npm ci` would ignore the root lockfile/workspaces and is wrong now.
      #
      # Several root dependencies place their platform binaries from an install script, and the one
      # lever the pinned npm offers is blanket: --ignore-scripts would disable all of them to
      # contain any one. Containment here is the job's read-only token instead. Revisit on the Node
      # bump whose npm first prints `npm warn allow-scripts` — that warning is per-package approval.
      - name: Install harness dependencies
        if: steps.check.outputs.has_suite == 'true' || steps.check.outputs.has_node_tests == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # The leg's VERSION reaches the harness, not a whole image reference: the repository is declared
      # once in Directory.Build.props and the harness reads it from there, exactly as the fetcher and the
      # build's staleness guard do with their own tag arguments. Composing the reference here would put a
      # second copy of that repository in this file, free to disagree with the declaration.
      - name: Run E2E suite
        id: e2e
        if: steps.check.outputs.has_suite == 'true'
        working-directory: tests/e2e
        shell: bash
        run: npx playwright test --project="$E2E_PROJECT"
        env:
          E2E_PROJECT: ${{ matrix.extension.e2eProject }}
          COVE_E2E_TAG: ${{ matrix.cove.tag }}

      # Did-it-run guard for a SUBSCRIBING entry: where the catalog declares the path, the node:test
      # correctness tier is a required backstop (it exercises loop-safety / ingest / rollback contracts
      # that are Compile-Removed from the bare C# leg), so a silent "0 specs found" must FAIL rather than
      # pass green. This closes the empty-glob case (the directory exists but holds no *.test.mjs); the
      # declared-but-missing path is already a hard error in the check step above, and the no-subscriber
      # case is reported there as a notice rather than passing unremarked.
      #
      # Required is conditional on subscription, and the wording above is deliberate: no entry declares
      # the path today, so this tier currently covers none of those contracts. Read it as what gates a
      # subscriber, never as a statement that the contracts are gated.
      - name: Guard the node:test tier actually has specs
        if: steps.check.outputs.has_node_tests == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          specs=("$E2E_NODE_TESTS_PATH"/*.test.mjs)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "::error::has_node_tests=true but no *.test.mjs under $E2E_NODE_TESTS_PATH — the required node correctness tier would silently pass."
            exit 1
          fi
          echo "node:test tier: found ${#specs[@]} spec file(s)."
        env:
          E2E_NODE_TESTS_PATH: ${{ matrix.extension.e2eNodeTestsPath }}

      # The container-correctness tier: an extension's non-browser API/webhook/sync specs run against
      # real containers whose external metadata source is a committed offline replay stub. It reads no
      # repository secret — identities resolve through the stub and the images are public — so it runs
      # on fork pull requests, where secrets are never provided. The glob is required: `node
      # --test <dir>` treats a bare directory as a module entry point on current Node and fails, so the
      # run must enumerate the spec files. Files run serially (--test-concurrency=1): each spec boots its
      # own container stack, and running them in parallel starves the runner's Docker host.
      - name: Run node:test correctness tier (offline, no secret)
        id: node_tests
        if: steps.check.outputs.has_node_tests == 'true'
        shell: bash
        run: node --test --test-concurrency=1 "$E2E_NODE_TESTS_PATH"/*.test.mjs
        env:
          E2E_NODE_TESTS_PATH: ${{ matrix.extension.e2eNodeTestsPath }}
          # Carried here as well as on the browser tier: a subscriber's specs that boot the shared harness
          # would otherwise run this version leg against the floor image, which reads as a leg testing a
          # version it never booted.
          COVE_E2E_TAG: ${{ matrix.cove.tag }}

      # The `list` reporter's stdout only ever shows pass/fail + duration, never the actual
      # assertion/stack-trace detail, which otherwise only reaches the Upload Playwright report
      # artifact below — requiring a download+unzip round trip to read. Dump it straight to the job
      # log instead so a CI failure is diagnosable from the log alone.
      - name: Dump E2E failure context
        if: steps.check.outputs.has_suite == 'true' && failure() && steps.e2e.outcome == 'failure'
        working-directory: tests/e2e
        shell: bash
        run: |
          for f in $(find test-results -name "error-context.md" 2>/dev/null); do
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload Playwright report
        if: steps.check.outputs.has_suite == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.extension.id }}-e2e-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  # ---- Required-check aggregation.
  # A single job to mark REQUIRED in branch protection on `main`, so a leg gates a merge by being in this
  # job's `needs:` AND by having its result tested in the shell body below. Listing a job in `needs:`
  # alone would let it fail while this gate still reported success.
  #
  # There are two safety legs and neither substitutes for the other:
  #   - test-cove-present runs the WHOLE C# suite in process, against Cove assemblies extracted from the
  #     released cove-app image. It sees seams no containerized run can reach — which principal a
  #     database command executed under, a rollback's intermediate state, an event hook's re-entrancy.
  #   - e2e installs the assembled package into the released host and drives it. It is the only check
  #     that would notice a package the host cannot load, which no in-process assertion can see.
  # A green here therefore means both were observed, not that one stood in for the other.
  #
  # Cove.Data is on no feed, and that is why the image is the route for it; Cove.Core, Cove.Plugins and
  # Cove.Sdk are published on nuget.org. Neither fact makes the cove-present leg optional: the leg exists
  # so the rollback / undo / ingest / loop-safety assertions the bare leg Compile-Removes block a merge
  # rather than resting on a local run a contributor can skip.
  required-checks:
    needs: [validate, build, test-cove-present, e2e]
    if: always()
    runs-on: ubuntu-latest
    # No token at all: this job only reads the other jobs' results and echoes them. An empty mapping
    # grants nothing, where omitting the block would inherit the workflow default.
    permissions: {}
    steps:
      - name: Assert the required legs succeeded
        shell: bash
        run: |
          echo "validate=${{ needs.validate.result }} build=${{ needs.build.result }} test-cove-present=${{ needs.test-cove-present.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.validate.result }}" != "success" ] \
            || [ "${{ needs.build.result }}" != "success" ] \
            || [ "${{ needs.test-cove-present.result }}" != "success" ] \
            || [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "::error::A required leg failed or was skipped — validate/build/test-cove-present/e2e must all be green."
            exit 1
          fi
          echo "All required legs green."

  # ---- Release. Depends on the aggregation job rather than on `build` directly, so a tag push must
  # clear the same set that must be green to merge. Naming that set a second time here would leave two
  # lists free to drift apart; a leg added to `required-checks` reaches the release path with no edit
  # in this job.
  #
  # What a green aggregate does NOT establish: the containerized install-and-enable run is the only
  # check that would notice a package the host cannot load, and it runs for a catalog entry only when
  # that entry declares e2ePath/e2eProject — both optional. For an entry declaring neither, the e2e
  # job's first step sets has_suite=false, every later step in it is skipped, and the job still reports
  # success. So a green aggregate proves the containerized install ran ONLY for an entry that declares
  # the path; for an entry without one it proves nothing about the package, and the release proceeds.
  release:
    needs: required-checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: "*.zip"
          generate_release_notes: true

  # csharp-format, windows-build-test, and markdown-lint moved to lint.yml — none of them have a
  # `needs:` link into this file's validate/build/e2e/release chain, so they gained nothing from
  # co-location and were missing main-push coverage that lint.yml now has (see lint.yml's header).
