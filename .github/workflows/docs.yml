# Build the standalone Docusaurus docs site (website/), and publish it to GitHub Pages once the
# commit that built it lands on main.
#
# ONE workflow, two paths: a pull request BUILDS, so a docs dependency bump is proven before merge;
# a push to main builds AND publishes. Separate from build.yml because the site has its own
# toolchain, and built with `npm --prefix website ...`.
#
# A pull request cannot publish, structurally rather than by convention: the workflow-level grant is
# contents:read, and the Pages-write and OIDC grants are scoped to the deploy job, which the
# pull-request path never reaches. That also covers a proposal from a fork.

name:
  Docs site

  # The site does NOT build from `website/` alone: docusaurus.config.ts sources each extension's own
  # docs/ folder, and a page there may import a file from the extension root — Renamer's changelog
  # page imports its CHANGELOG.md. A `website/**` filter therefore cannot see the files that break
  # the build, which is not hypothetical: a changelog edit broke it and stayed broken. The globs are
  # per-extension-shaped, so a new extension is covered by adding its folder.
  #
  # The filter is on the pull-request path only. Actions cannot share one `paths:` list across two
  # triggers, and the publish path is left unfiltered so an under-matching glob can never leave the
  # published site stale.
on:
  pull_request:
    paths:
      - "website/**"
      - "extensions/*/docs/**"
      - "extensions/*/CHANGELOG.md"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege floor: read the repo. The publish grants are declared per-job below, so the job
# that installs and runs the site's dependencies holds neither of them, on either path.
permissions:
  contents: read

# Both behaviours, keyed on the event, because the two paths want opposite things and one setting
# applied to both would be wrong for one of them. A superseded PR build is waste, so it is
# cancelled and grouped per ref. A cancelled deploy can leave the site half-published, so the
# publish path serializes on the shared `pages` group and never cancels.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure Pages queries the repository's Pages settings, and a permissions block sets every
    # unlisted scope to none — hence the explicit pages:read. No write scope: this job cannot
    # deploy, on any event.
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.11.0"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      # Publish preparation, skipped on a pull request: there is no deploy to hand an artifact to.
      # The built site does not depend on it — docusaurus.config.ts carries `url` and `baseUrl` as
      # literals and reads no environment — so the pull-request path skips these two steps and
      # still builds the same site the publish path builds.
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build the docs site
        run: npm --prefix website ci && npm --prefix website run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    # Two independent gates, and the pair is the point. `needs` stops a publish behind a red build;
    # the `if` makes this job unreachable from a pull request whatever the build did. A manual run
    # still publishes, which is the behaviour this file had before the merge and is not silently
    # dropped here.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can publish. deploy-pages authenticates the deployment with an OIDC token,
    # so id-token:write is inseparable from pages:write here. No contents scope — it checks nothing
    # out.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
