version: 2
updates:
  # All C# NuGet versions live in the single root Directory.Packages.props (Central Package
  # Management), so one root-scoped block watches the whole solution and a new extension needs no
  # edit here.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # A cooldown holds a version update until the release has been public for a while, so a malicious
    # release is usually pulled before it reaches a pull request. Security updates ignore it.
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    # Packages that must match the Cove host, bumped by hand in lockstep with it, never by Dependabot.
    # Cove.Sdk, Cove.Plugins and Cove.Core are the host SDK, versioned by $(CoveSdkVersion) from each
    # extension's minCoveVersion; Dependabot ignores that indirection and rewrote the property instead
    # (#62, #82, #83). EF Core is Private=false, so the host's copy is what loads and an API compiled
    # against a newer version is missing at run time. Npgsql is pinned in the test project to the
    # version the host runs, for the same reason.
    ignore:
      - dependency-name: "Cove.Sdk"
      - dependency-name: "Cove.Plugins"
      - dependency-name: "Cove.Core"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Npgsql"
    groups:
      test-analysis:
        patterns:
          - "xunit*"
      # These ship together on the monthly .NET servicing release.
      dotnet-servicing:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "System.*"

  # The JS workspaces root (the shared e2e harness and every extension's e2e workspace, one lockfile)
  # and every extension's UI package (each with its own lockfile). One block, so a package both
  # declare arrives in one pull request: syncpack requires them to match, and one pull request per
  # directory fails that check on each side. @cove/extension-sdk is a vendored tarball, updated by
  # re-vendoring rather than by Dependabot.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/extensions/*/src/*.Ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    # TypeScript 7 ships no compiler API, and typescript-eslint and openapi-typescript read the root's
    # copy through it. An ignore applies to every directory in this block, so a major update is
    # held for the extension UIs too; minor and patch updates still reach both.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    # A dependency joins the first group it matches, so the React group comes before the catch-all.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "@tanstack/*"
      # Every other dependency: one pull request per dependency across every directory that declares
      # it. Version updates only; a security update still opens one pull request per directory.
      same-dependency:
        group-by: dependency-name

  # Docs site (Docusaurus), with its own lockfile. The co-versioned @docusaurus/* and @mdx-js/*
  # packages arrive as one pull request per release.
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    # The docs site stays on TypeScript 6, matching the root.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@mdx-js/*"

  # With "/" alone Dependabot reads only .github/workflows and a root action.yml, so the composite
  # actions under .github/actions are listed too.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 5
