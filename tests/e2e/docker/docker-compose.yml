# Shared E2E harness — brings up an isolated, official Cove instance for testing an extension.
#
# Never touches the developer's local native Cove install (%LOCALAPPDATA%\cove / COVE_HOME) — all
# state is ephemeral, scoped to this compose project, and removed on teardown.
#
# Extension install is NOT a host bind-mount. A bind-mount depends on the host's Docker file-sharing
# configuration (on Windows, Docker Desktop's drive-sharing allowlist), so the suite would run only
# where the right drive happens to be shared. `lib/install-extension.mjs` stages the extension on the
# host and copies it into the running container's /config/extensions/<id>/ through Testcontainers'
# own container API instead. The on-disk shape is the one Cove's bind-mount install produces
# (cove/docker/README.md); only the delivery differs.
#
# Not driven directly via `docker compose` CLI — `lib/harness.mjs`'s `startHarness()` (Testcontainers'
# DockerComposeEnvironment) is the actual entry point; see tests/e2e/README.md.

# Every stack joins ONE network that already exists, rather than getting a default network of its
# own. Compose creates a bridge per project, the kernel gives each new bridge an IPv4 address, and
# Chromium tears down every in-flight request when a host address appears or goes away
# (net/base/address_tracker_linux.cc raises RTM_NEWADDR to OnIPAddressChanged; the four socket and
# session pools that observe it flush with ERR_NETWORK_CHANGED). The browser here loads the app over
# a published port from the host, so what it drops is the app's own script chunks: the page then
# renders nothing, on the right URL, with no script error and no failed navigation to point at.
#
# `isolatedHarnessFixture` takes a stack per TEST, so the measured cost of a project-owned network was
# 21 bridge creations and 21 removals in one run - 42 address events, every one of them ours. Joining
# an existing network creates no interface, so the suite raises none.
#
# Attaching a container still creates a veth, and that is a LINK event: RTM_NEWLINK sets only
# `link_changed`, which reaches OnLinkChanged and at most a connection-type notification. No socket
# pool observes that one, so it cannot produce ERR_NETWORK_CHANGED. Interface churn per se is not the
# hazard; a host ADDRESS appearing is.
#
# `external` is what makes this a join rather than a create. `lib/global-setup.mjs` creates the
# network once before any worker starts, which is the one moment in the run when an address event
# costs nothing, because no browser exists yet.
networks:
  default:
    name: ${COVE_E2E_NETWORK:-cove-e2e-shared}
    external: true

services:
  db:
    image: pgvector/pgvector:pg18
    # One network for every stack means one DNS namespace for every stack. Compose aliases a service
    # by its own name, so N stacks would each publish `db` and `Host=db` would round-robin across
    # other tests' databases - the same instance answering as a different library, which is a wrong
    # answer rather than an error. This alias is the name the cove service actually dials, and it is
    # unique per stack.
    networks:
      default:
        aliases:
          - db-${COVE_E2E_STACK:?set by tests/e2e/lib/harness.mjs, one value per stack - without it every stack would answer to the same database hostname}
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  cove:
    # Required, with NO default: `lib/harness.mjs`'s resolveCoveImage decides which host boots, and a
    # version written here would be a second declaration of one that already lives in a manifest. A
    # host below an extension's floor does not error, it silently refuses to LOAD the extension, so
    # the routes 404 and every browser spec fails against a Settings page that never gains the
    # extension's tab. A floating `latest` names no version, so a stale local copy of that tag lands
    # in the same silent failure.
    #
    # The cost: `docker compose up` in this directory starts nothing on its own. Go through the
    # harness (see ../README.md), or name an image in COVE_E2E_IMAGE.
    image: ${COVE_E2E_IMAGE:?set by tests/e2e/lib/harness.mjs from the catalog floor — this compose file declares no Cove version, so a bare docker compose invocation must name one}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${COVE_E2E_PORT:-0}:5073"
    environment:
      COVE__Postgres__Managed: "false"
      COVE__Postgres__ConnectionString: "Host=db-${COVE_E2E_STACK};Port=5432;Database=cove;Username=cove;Password=cove"
      COVE_HOME: /config
      COVE__GeneratedPath: /generated
      COVE__CachePath: /cache
      COVE__BackupPath: /backups
      # The two media directories, declared as Cove's own library paths. Cove seeds none by default,
      # and /api/videos/from-file takes an explicit path without consulting this list, so without
      # these the instance runs with NO library path — which no real install does. An extension
      # asking which library path holds a file then gets no answer, and behaves as it would for a
      # file genuinely outside the library, a different code path from the one the specs drive.
      # /data2 is listed because the cross-device spec moves files there.
      COVE__CovePaths__0__Path: /data
      COVE__CovePaths__1__Path: /data2
      # Authentication is OFF by default, which is what every spec but the auth one runs against. A
      # spec needing a real credential flow opts in with
      # `startHarness({ env: { COVE_E2E_AUTH_ENABLED: 'true' } })`. The flip is instance-global, so it
      # belongs to an isolated harness and never to a worker-shared one.
      COVE__Auth__Enabled: "${COVE_E2E_AUTH_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5073/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    tmpfs:
      # A genuinely separate filesystem, not just a separate directory or named volume. Verified
      # empirically: two named volumes both land on Docker Desktop's single backing block device
      # (same st_dev), so a move between them succeeds via a normal rename() — it does NOT exercise
      # any cross-device code path. A tmpfs mount is a different filesystem TYPE at the kernel level,
      # so a move from the container's root filesystem into it raises a real EXDEV ("cross-device
      # link not permitted"), the same error a move across two real drives raises. This is the one
      # mount strategy that actually triggers cross-device behavior inside a single container.
      #
      # The extension's volume classifier is mount-aware: it enumerates the container's own mounts, so
      # /data keys to "/" and /data2 keys to "/data2", and the pair classifies CROSS-volume. This mount
      # therefore exercises the verified copy path, not only the EXDEV that raises it.
      #
      # Ownership decides whether anything can write here at all, and it is not constant across the
      # container's life. The mount is root-owned throughout. On first bring-up it arrives
      # world-writable with the sticky bit, so the image's own non-root process can create files in it.
      # A restart resets it to root-owned with no world write, and a write by that same non-root user
      # is then DENIED. Only Docker's restart changes this; a root-owned mode is not the image user's
      # to alter.
      #
      # Every spec reaches this container through `installExtension`, which restarts it before the
      # spec's first line runs, so the state under test is always the post-restart one. A spec that
      # writes into /data2 must therefore hand the mount over to itself first.
      - /data2
