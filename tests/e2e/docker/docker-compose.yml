# Shared E2E harness — brings up an isolated, official Cove instance for testing an extension.
#
# Never touches the developer's local native Cove install (%LOCALAPPDATA%\cove / COVE_HOME) — all
# state is ephemeral, scoped to this compose project, and removed on teardown.
#
# Extension install: NOT a host bind-mount. Host bind-mounts depend on the host's Docker file-
# sharing configuration (e.g. Docker Desktop's drive-sharing allowlist on Windows) — a test suite
# that only works when the host happens to have the right drive shared is not something every
# contributor or CI runner can rely on. Instead, `lib/install-extension.mjs` stages the extension
# on the host, then copies it into the running container's /config/extensions/<id>/ via
# Testcontainers' own container API (see `lib/harness.mjs`), which works identically regardless of
# host file-sharing config. This is the same on-disk shape Cove's own bind-mount install method
# produces (cove/docker/README.md) — only the delivery mechanism differs.
#
# Not driven directly via `docker compose` CLI — `lib/harness.mjs`'s `startHarness()` (Testcontainers'
# DockerComposeEnvironment) is the actual entry point; see tests/e2e/README.md.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: cove
      POSTGRES_USER: cove
      POSTGRES_PASSWORD: cove
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cove -d cove"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql

  cove:
    # Required, with NO default: `lib/harness.mjs`'s resolveCoveImage is the only thing that decides
    # which host boots — the highest floor the catalog's extensions declare in their own manifests, on
    # the repository the build properties declare, with a CI leg's resolved version overriding it. A
    # version written here would be a second declaration of a number that already lives in a manifest,
    # free to fall behind it — and a host below an extension's floor does not error, it silently refuses
    # to LOAD the extension, so the routes 404 and every browser spec fails against a Settings page that
    # never gains the extension's tab. A floating `latest` is not the alternative either: it names no
    # version, so a stale local copy of that tag can sit below the floor and drop the whole suite into
    # the same silent failure with nothing to compare against.
    #
    # The cost this shape accepts: `docker compose up` in this directory no longer starts anything,
    # because there is no value left to fall back to. Go through the harness (see ../README.md), or
    # name an image yourself in COVE_E2E_IMAGE.
    image: ${COVE_E2E_IMAGE:?set by tests/e2e/lib/harness.mjs from the catalog floor — this compose file declares no Cove version, so a bare docker compose invocation must name one}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${COVE_E2E_PORT:-0}:5073"
    environment:
      COVE__Postgres__Managed: "false"
      COVE__Postgres__ConnectionString: "Host=db;Port=5432;Database=cove;Username=cove;Password=cove"
      COVE_HOME: /config
      COVE__GeneratedPath: /generated
      COVE__CachePath: /cache
      COVE__BackupPath: /backups
      # The two media directories, declared as Cove's own library paths. Cove seeds none by default
      # and the specs create their file rows through /api/videos/from-file — an import that takes an
      # explicit path and never consults this list — so without these the instance ran with NO library
      # path at all, which no real install does. That gap is not cosmetic: an extension asking "which
      # library path holds this file" gets no answer here and behaves as it would for a file genuinely
      # outside the library, which is a different code path from the one the specs mean to drive.
      # /data2 is listed beside /data because the cross-device spec moves files there.
      COVE__CovePaths__0__Path: /data
      COVE__CovePaths__1__Path: /data2
      # Authentication is OFF by default: every existing spec runs against the bypass principal and
      # must keep doing so. A suite that needs a real credential flow opts in per instance with
      # `startHarness({ env: { COVE_E2E_AUTH_ENABLED: 'true' } })` — flipping it is instance-global,
      # so it belongs to an isolated harness, never to a worker-shared one.
      COVE__Auth__Enabled: "${COVE_E2E_AUTH_ENABLED:-false}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5073/health"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    tmpfs:
      # A genuinely separate filesystem, not just a separate directory or named volume. Verified
      # empirically: two named volumes both land on Docker Desktop's single backing block device
      # (same st_dev), so a move between them succeeds via a normal rename() — it does NOT exercise
      # any cross-device code path. A tmpfs mount is a different filesystem TYPE at the kernel level,
      # so a move from the container's root filesystem into it raises a real EXDEV ("cross-device
      # link not permitted"), the same error a move across two real drives raises. This is the one
      # mount strategy that actually triggers cross-device behavior inside a single container.
      #
      # The extension's volume classifier is mount-aware: it enumerates the container's own mounts, so
      # /data keys to "/" and /data2 keys to "/data2", and the pair classifies CROSS-volume. This mount
      # therefore exercises the verified copy path, not only the EXDEV that raises it.
      #
      # OWNERSHIP, stated here because it decides whether anything can write into this mount at all, and
      # because the only prior account of it lived inside the one spec that works around it.
      #
      # The mount is root-owned throughout, and its permissions are NOT constant across the container's
      # life. On first bring-up it arrives world-writable with the sticky bit, so the image's own
      # non-root process can create files in it with no handover. A container restart resets it to
      # root-owned with no world write, and a write by that same non-root user is then DENIED.
      #
      # Docker's restart is what changes it; nothing inside the container can, because a root-owned mode
      # is not the image user's to alter. That is why two readings taken at different points both stand:
      # a world-writable one and a non-writable one describe this same declaration in two different
      # states, and neither refutes the other.
      #
      # Which state a spec meets follows from the harness, not from this file: every spec reaches this
      # container through `installExtension`, which restarts it before the spec's first line runs. So the
      # state under test is always the post-restart one, and a spec that writes into /data2 must hand the
      # mount over itself first — which is what extensions/Renamer/e2e/tests/cross-device-move.spec.mjs
      # does, and why the refusal its first phase builds on is sound rather than stale.
      #
      # Established through the harness itself — `startHarness()` plus `handle.restart()` — because that
      # is the route the specs take. A bare `docker compose` bring-up observes only the first state, and
      # reasoning from it to the specs is the inference that put a wrong ownership fact here before: the
      # variable is the restart, not the compose file.
      - /data2
