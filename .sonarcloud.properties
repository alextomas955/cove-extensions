# SonarQube Cloud — Automatic Analysis scope.
#
# Two facts about this file decide everything in it, and both are easy to get wrong.
#
# FIRST: the filename. Automatic Analysis reads `.sonarcloud.properties` and IGNORES
# `sonar-project.properties`, which is the CI-based scanner's file. A repository carrying the wrong
# one gets silence, not an error.
#
# SECOND: only the default branch's copy is read. Editing this on a branch changes nothing until
# that branch merges, so a scope fix cannot be verified on the pull request that makes it — expect
# the first effect on `main`.
#
# The supported key set is small and fixed: sources, tests, their inclusions/exclusions, cpd
# exclusions and source encoding. Coverage import is NOT among them at all — no key here can turn it
# on, because Automatic Analysis does not support coverage in any configuration. That needs the
# CI-based scanner, which is a different analysis method rather than a different setting.

sonar.sourceEncoding=UTF-8

# Deliberately NOT set here: sonar.tests / sonar.test.inclusions. Sonar treats a file classified as
# both source and test as a configuration error, and `scripts/` holds production tooling and its
# tests side by side, so a directory-level test declaration cannot be right for it. Getting that
# wrong fails the analysis outright rather than degrading it — and because only the default branch's
# copy of this file is read, a mistake here cannot be caught on the pull request that introduces it.
# Everything below therefore only ever NARROWS what is analysed, which is the safe direction under a
# setting nobody can test first. Revisit once CI-based analysis makes the effect observable per PR.

# Machine-authored or machine-fetched files. Analysing them reports defects at an author who cannot
# act on them and, worse, spends the New Code budget on churn nobody wrote.
#   - src/wire/**   generated from each extension's OpenAPI document; regenerated every build.
#   - vendor/*.tgz  the vendored Cove SDK package, shipped as an opaque archive.
#   - build output  dist/, bin/, obj/ and the docs site's build/ are compiler products.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/bin/**,\
  **/obj/**,\
  **/vendor/**,\
  website/build/**,\
  website/.docusaurus/**,\
  extensions/*/src/*.Ui/src/wire/**

# Duplication is measured across product code only. A test file that legitimately replays the same
# recorded fixture as its neighbour is not a copy-paste defect, and counting it as one is what made
# the repo's previous duplication gate report a number nobody could act on.
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.spec.mjs,\
  **/*.spec.ts,\
  **/*Tests.cs
