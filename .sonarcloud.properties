# SonarQube Cloud — Automatic Analysis scope. Two things about this file are easy to get wrong:
#
# The FILENAME. Automatic Analysis reads `.sonarcloud.properties` and ignores
# `sonar-project.properties`, which belongs to the CI-based scanner. The wrong one gets silence, not
# an error.
#
# Only the DEFAULT BRANCH's copy is read, so editing this on a branch changes nothing until it
# merges — a scope fix cannot be verified on the pull request that makes it.
#
# The supported key set is small: sources, tests, their inclusions/exclusions, cpd exclusions and
# encoding. Coverage import is not among them in any configuration; that needs the CI-based scanner.

sonar.sourceEncoding=UTF-8

# Deliberately NOT set: sonar.tests / sonar.test.inclusions. Sonar treats a file classified as both
# source and test as a configuration error, and `scripts/` holds production tooling beside its own
# tests, so a directory-level test declaration cannot be right for it.
# Everything below therefore only ever NARROWS what is analysed, which is the safe direction under a
# setting nobody can test first. Revisit once CI-based analysis makes the effect observable per PR.

# Machine-authored or machine-fetched files. Analysing them reports defects at an author who cannot
# act on them and, worse, spends the New Code budget on churn nobody wrote.
#   - src/wire/**   generated from each extension's OpenAPI document; regenerated every build.
#   - vendor/*.tgz  the vendored Cove SDK package, shipped as an opaque archive.
#   - build output  dist/, bin/, obj/ and the docs site's build/ are compiler products.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/bin/**,\
  **/obj/**,\
  **/vendor/**,\
  website/build/**,\
  website/.docusaurus/**,\
  extensions/*/src/*.Ui/src/wire/**

# Duplication is measured across product code only. A test file that legitimately replays the same
# recorded fixture as its neighbour is not a copy-paste defect, and counting it as one is what made
# the repo's previous duplication gate report a number nobody could act on.
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.spec.mjs,\
  **/*.spec.ts,\
  **/*Tests.cs
