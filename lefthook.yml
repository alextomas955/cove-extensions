# lefthook — one pre-commit gate spanning the mixed C# + TypeScript repo (plan §4.3).
#
# Why lefthook (not husky+lint-staged): a single language-agnostic YAML runs the .NET and Node
# checks together. ESLint is one repo-root config (eslint.config.mjs) covering every extension's UI
# and all .mjs/.cjs scripts; the same type-aware gate runs here and in CI (lint.yml's js-lint job),
# since the vendored @cove/extension-sdk is committed and installs offline in both.
#
# Keep it lightweight: format/lint only STAGED files; no full build or test run on commit.

pre-commit:
  parallel: true
  commands:
    # --- TypeScript/JS: one repo-root Prettier, then one repo-root ESLint ---
    # Selected by file type and never by location, so a second extension or a second shared package
    # needs no entry here. Formatting settings resolve per file by walking up from it, so a package
    # that needs its own conventions declares them without this entry knowing.
    format:
      glob: "*.{ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    check-classes-renamer:
      root: extensions/Renamer/src/Renamer.Ui/
      glob: "*.tsx"
      run: npm run check-classes

    # Every host import-map external (lucide-react) resolved against the module the HOST actually
    # serves, not the one in node_modules. Those differ: a name can typecheck, build and pass every
    # offline gate while the shipped bundle fails to load in the browser and every surface renders
    # "Extension component not found". That shipped once. Local-only by construction — it reads the
    # host's generated shim, so it skips with a notice when no ../cove sibling is present (the
    # sdk-drift-check precedent), which also means CI cannot run it.
    check-host-imports:
      glob: "*.{ts,tsx}"
      run: node scripts/check-host-imports.mjs

    # A response type declared in PascalCase against its camelCase wire. It typechecks,
    # so every field reads undefined at runtime with no error anywhere — the settings quality-profile
    # picker shipped four days that way. BLOCKING from the start, which is the exception to the repo's
    # land-warn-then-flip rule: that rule exists for tools that land red on main, and this one lands
    # green because both known sites are fixed in the same change.
    check-response-casing:
      glob: "*.{ts,tsx}"
      run: node scripts/check-response-casing.mjs

    # Single monorepo-wide ESLint (root eslint.config.mjs): every extension's TS/React UI + all
    # first-party .mjs/.cjs helper/build/test scripts. Type-aware, so it resolves each UI's installed
    # deps on the dev box.
    js-lint:
      glob: "*.{ts,tsx,mjs,cjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    # --- C#: format changed projects in place (cheap; no full build) ---
    # Fixes rather than verifies, matching the prettier/eslint hooks above: the check costs the same
    # solution load either way, so reporting a violation a contributor then has to fix by hand buys
    # nothing over fixing it here.
    csharp-format:
      glob: "*.cs"
      run: dotnet format CoveExtensions.slnx --severity warn --include {staged_files}
      stage_fixed: true

    # Local-only: warns when the committed vendor/cove-extension-sdk-*.tgz drifts from the
    # sibling ../cove checkout's frontend SDK version. Cannot run in CI (no ../cove there) — it
    # no-ops there and on any clean clone lacking the sibling. Unconditional (not glob-scoped):
    # the script itself no-ops fast when the sibling is absent, which is cheaper and safer than
    # a multi-path glob pattern here. Runs with --warn so it never blocks a commit (informational
    # only); drop --warn to make it a hard fail once the maintainer wants drift to block commits.
    sdk-drift-check:
      run: node extensions/Renamer/scripts/check-sdk-drift.mjs --warn

    # Flags a registered endpoint or a response field that no caller consumes — the UI bundle, the host manifest
    # and the inbound webhook are all checked first. A compiler cannot see this: the C# side builds and the TS
    # side simply never mentions the symbol. Advisory while it lands (the repo's tooling rollout rule), because a
    # field with no UI is sometimes a deliberate advanced option rather than dead surface.
    wire-usage-check:
      run: node scripts/check-wire-usage.mjs --warn

    # Flags added comments in the staged diff that read as narrative (change-story, consumer-behavior,
    # author voice) instead of a non-obvious why (the CLAUDE.md rule). Heuristic, so it WARNS only; drop
    # --warn to make narrative comments a hard fail. This hook carries no glob, so on a doc-only commit
    # the diff is empty and the gate reports NO INPUT — --warn is what keeps that from blocking. To audit
    # a branch rather than one commit: node scripts/check-comment-hygiene.mjs --range main..HEAD
    comment-hygiene:
      run: node scripts/check-comment-hygiene.mjs --warn
