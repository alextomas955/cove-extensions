# lefthook — one pre-commit gate spanning the mixed C# + TypeScript repo.
#
# Why lefthook (not husky+lint-staged): a single language-agnostic YAML runs the .NET and Node
# checks together. ESLint is one repo-root config (eslint.config.mjs) covering every extension's UI
# and all .mjs/.cjs scripts; the same type-aware gate runs here and in CI (lint.yml's js-lint job),
# since the vendored @cove/extension-sdk is committed and installs offline in both.
#
# Keep it lightweight: format/lint only STAGED files; no full build or test run on commit.

pre-commit:
  parallel: true
  commands:
    # --- TypeScript/JS: one repo-root Prettier, then one repo-root ESLint ---
    # Selected by file type and never by location, so a second extension or a second shared package
    # needs no entry here. Formatting settings resolve per file by walking up from it, so a package
    # that needs its own conventions declares them without this entry knowing.
    format:
      glob: "*.{ts,tsx,mjs,cjs,json,jsonc,css,md,mdx,yml,yaml}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    check-classes-renamer:
      root: extensions/Renamer/src/Renamer.Ui/
      glob: "*.tsx"
      run: npm run check-classes

    # Every host import-map external (lucide-react) resolved against the module the HOST actually
    # serves, not the one in node_modules. Those differ: a name can typecheck, build and pass every
    # other check while the shipped bundle fails to load in the browser and every surface renders
    # "Extension component not found". That shipped once. Local-only by construction — it reads the
    # host's generated shim, so it skips with a notice when no ../cove sibling is present (the
    # sdk-drift-check precedent), which also means CI cannot run it.
    check-host-imports:
      glob: "*.{ts,tsx}"
      run: node scripts/check-host-imports.mjs

    # Single monorepo-wide ESLint (root eslint.config.mjs): every extension's TS/React UI + all
    # first-party .mjs/.cjs helper/build/test scripts. Type-aware, so it resolves each UI's installed
    # deps on the dev box.
    js-lint:
      glob: "*.{ts,tsx,mjs,cjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    # --- C#: format changed projects in place (cheap; no full build) ---
    # Fixes rather than verifies, matching the prettier/eslint hooks above: the check costs the same
    # solution load either way, so reporting a violation a contributor then has to fix by hand buys
    # nothing over fixing it here.
    csharp-format:
      glob: "*.cs"
      run: dotnet format CoveExtensions.slnx --severity warn --include {staged_files}
      stage_fixed: true
